name: Versioned delivery

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deliver:
    name: Package tested version as a draft release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag matches application version
        run: node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF_NAME!==`v${p.version}`) process.exit(1)'
      - run: npm ci
      - run: npm run build
      - run: python scripts/package.py
      - run: python -m pip install -r requirements.txt
      - run: python scripts/smoke_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: release/*
          retention-days: 30
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag --generate-notes
